<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolync — AI GTM Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { font-family: 'Inter', sans-serif; }
  .slide-in { animation: slideIn 0.25s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse-dot { animation: pulseDot 1.5s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .wf-bar { flex-shrink: 0; width: 4px; border-radius: 2px; background: rgba(255,255,255,0.45); transform-origin: center; }
  .wf-bar.wave-idle { animation: wfIdle var(--dur,0.7s) ease-in-out var(--delay,0s) infinite; }
  .wf-bar.wave-talk { animation: wfTalk var(--fdur,0.3s) ease-in-out var(--delay,0s) infinite; }
  @keyframes wfIdle { 0%,100% { transform:scaleY(0.22); opacity:0.28; } 50% { transform:scaleY(0.62); opacity:0.52; } }
  @keyframes wfTalk { 0%,100% { transform:scaleY(0.55); opacity:0.65; } 50% { transform:scaleY(1.18); opacity:1.0; } }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(99,102,241,0.2); border-top-color: #818cf8; border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step-fade-in { animation: stepFade 0.18s ease-out; }
  @keyframes stepFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  .fade-out { animation: fadeOut 0.18s ease-out forwards; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<!-- Header -->
<header class="border-b border-gray-800/60 px-6 py-3.5 flex items-center justify-between sticky top-0 bg-gray-950/95 backdrop-blur z-10">
  <div class="flex items-center gap-2.5">
    <div class="w-7 h-7 bg-indigo-500 rounded-md flex items-center justify-center text-xs font-bold tracking-tight">R</div>
    <span class="font-semibold text-white text-sm">Rolync</span>
  </div>
  <div class="flex items-center gap-2 text-xs">
    <span id="s1" class="text-indigo-400 font-medium">ICP Discovery</span>
    <span class="text-gray-700">›</span>
    <span id="s2" class="text-gray-600">Lead Sourcing</span>
    <span class="text-gray-700">›</span>
    <span id="s3" class="text-gray-600">Live Call</span>
  </div>
</header>

<!-- ── View 1: ICP Chat ──────────────────────────────────────────────────── -->
<div id="view-icp" class="max-w-xl mx-auto px-4 py-8 flex flex-col" style="min-height: calc(100vh - 56px)">
  <div id="chat-messages" class="flex-1 space-y-4 mb-5 overflow-y-auto">
    <!-- seed message -->
    <div class="slide-in flex gap-2.5">
      <div class="w-7 h-7 bg-indigo-600 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-semibold mt-0.5">AI</div>
      <div class="bg-gray-800 rounded-2xl rounded-tl-none px-4 py-3 max-w-sm text-sm leading-relaxed text-gray-100">
        Hey! Let's define who Rolync should be targeting for you. Tell me — what does your product do, and who are the customers you have today?
      </div>
    </div>
  </div>

  <!-- ICP lock card -->
  <div id="icp-card" class="hidden mb-5 rounded-xl border border-indigo-500/50 bg-indigo-500/8 p-4 slide-in">
    <div class="flex items-center gap-2 mb-3">
      <span class="text-indigo-400 text-xs font-semibold uppercase tracking-wide">✓ ICP Locked</span>
    </div>
    <div id="icp-details" class="text-sm text-gray-300 space-y-1.5 mb-4"></div>
    <button onclick="startPipeline()"
      class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-lg py-2.5 text-sm font-semibold transition-colors">
      Find Leads →
    </button>
  </div>

  <!-- Input -->
  <div id="input-row" class="flex gap-2">
    <input id="chat-input" type="text" placeholder="Type your answer..."
      class="flex-1 bg-gray-800/80 border border-gray-700 rounded-xl px-4 py-3 text-sm placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors"
      onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()"
      class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl px-5 text-sm font-medium transition-colors">
      Send
    </button>
  </div>
  <div class="mt-3 text-center flex items-center justify-center gap-4">
    <button onclick="usePresetIcp()"
      class="text-xs text-gray-600 hover:text-gray-400 underline underline-offset-2 transition-colors">
      Skip — use Rolync ICP
    </button>
    <span class="text-gray-800 text-xs">·</span>
    <button onclick="jumpToCall()"
      class="text-xs text-indigo-600 hover:text-indigo-400 underline underline-offset-2 transition-colors">
      ⚡ Demo call (instant)
    </button>
  </div>
</div>

<!-- ── View 2: Lead Pipeline ──────────────────────────────────────────────── -->
<div id="view-leads" class="hidden" style="height: calc(100vh - 56px)">
  <div class="flex flex-col items-center justify-center h-full">

    <!-- Centered step display while agent runs -->
    <div id="step-display" class="flex flex-col items-center gap-5 text-center px-8" style="max-width:360px; width:100%">
      <div id="step-spinner" class="spinner" style="width:22px;height:22px"></div>
      <div id="step-text" class="text-sm text-gray-200 leading-relaxed"></div>
      <div id="step-count" class="text-xs text-gray-700"></div>
    </div>

    <!-- Vertical lead cards (hidden until first lead arrives) -->
    <div id="cards" class="flex flex-col items-center gap-4 overflow-y-auto px-5 py-4 w-full" style="display:none; max-height:calc(100vh - 112px)">
    </div>

  </div>
</div>

<!-- ── View 3: Call Screen ─────────────────────────────────────────────────── -->
<div id="view-call" class="hidden flex flex-col" style="height:calc(100vh - 56px); background:linear-gradient(165deg,#0d2210 0%,#091a0b 52%,#050d06 100%)">

  <!-- Name pill + timer + status -->
  <div class="flex flex-col items-center pt-10 pb-1">
    <div class="bg-black/40 backdrop-blur-sm border border-white/10 rounded-full px-5 py-2 flex items-center gap-3">
      <span id="call-name-pill" class="text-white text-sm font-medium tracking-tight">Calling...</span>
      <span class="text-white/20 text-xs">·</span>
      <span id="call-timer" class="text-white/45 text-sm font-mono tabular-nums">00:00</span>
    </div>
    <div class="flex items-center gap-2 mt-3">
      <div id="status-dot" class="w-1.5 h-1.5 bg-green-400 rounded-full pulse-dot"></div>
      <span id="call-status" class="text-white/35 text-xs">Connecting...</span>
    </div>
  </div>

  <!-- Waveform -->
  <div class="flex-1 flex items-center justify-center">
    <div id="waveform" class="flex items-center justify-center gap-1.5" style="height:100px;width:100%;max-width:380px;padding:0 20px;box-sizing:border-box"></div>
  </div>

  <!-- Controls -->
  <div class="flex justify-center items-center gap-7 pb-9">
    <button class="w-14 h-14 bg-white/10 hover:bg-white/16 border border-white/10 rounded-full flex items-center justify-center transition-all" title="Microphone">
      <svg width="20" height="20" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="w-14 h-14 bg-white/10 hover:bg-white/16 border border-white/10 rounded-full flex items-center justify-center transition-all" title="Speaker">
      <svg width="20" height="20" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>
    <button onclick="endCall()" class="w-16 h-16 bg-red-500 hover:bg-red-400 rounded-full flex items-center justify-center transition-all" style="box-shadow:0 0 28px rgba(239,68,68,0.32)" title="End call">
      <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    </button>
  </div>

  <!-- Transcript card -->
  <div id="transcript-wrap" class="bg-black/38 backdrop-blur-md border-t border-white/8 rounded-t-3xl overflow-y-auto" style="max-height:215px">
    <div class="px-5 pt-4 pb-0.5">
      <span class="text-xs text-white/28 font-semibold uppercase tracking-widest">Transcript</span>
    </div>
    <div id="transcript" class="px-5 pb-5 space-y-3">
      <div id="tx-empty" class="text-center text-white/22 text-sm py-3">Waiting for call to connect...</div>
    </div>
  </div>
</div>

<script>
let sessionId = null;
let lockedIcp = null;
let activeLead = null;
let callStartTime = null;
let callTimerInterval = null;
let waveTimer = null;
let activeCallEs = null;

function initWaveform() {
  const wf = document.getElementById('waveform');
  wf.innerHTML = '';
  const n = 22;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const bell = Math.exp(-Math.pow((t - 0.5) * 2.8, 2));
    const h = ((0.12 + bell * 0.72 + Math.random() * 0.16) * 100).toFixed(0);
    const dur = (0.5 + Math.random() * 0.45).toFixed(2);
    const delay = (Math.random() * 0.45).toFixed(2);
    const fdur = (parseFloat(dur) * 0.42).toFixed(2);
    const bar = document.createElement('div');
    bar.className = 'wf-bar wave-idle';
    bar.style.cssText = `height:${h}%;--dur:${dur}s;--fdur:${fdur}s;--delay:${delay}s`;
    wf.appendChild(bar);
  }
}

function setWaveState(talking) {
  if (waveTimer) clearTimeout(waveTimer);
  document.querySelectorAll('.wf-bar').forEach(b => {
    b.classList.toggle('wave-idle', !talking);
    b.classList.toggle('wave-talk', talking);
  });
  if (talking) waveTimer = setTimeout(() => setWaveState(false), 4500);
}

function startCallTimer() {
  callStartTime = Date.now();
  callTimerInterval = setInterval(() => {
    const el = document.getElementById('call-timer');
    if (!el) return;
    const ms = Date.now() - callStartTime;
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

function endCall() {
  if (activeCallEs) { activeCallEs.close(); activeCallEs = null; }
  setWaveState(false);
  if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
  document.getElementById('status-dot').className = 'w-1.5 h-1.5 bg-gray-600 rounded-full';
  document.getElementById('call-status').textContent = 'Call ended';
}

// ── ICP ───────────────────────────────────────────────────────────────────────
async function send() {
  const inp = document.getElementById('chat-input');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  inp.disabled = true;

  addBubble('user', msg);

  const r = await fetch('/icp/message', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, message: msg}),
  });
  const d = await r.json();
  sessionId = d.session_id;
  addBubble('agent', d.reply);

  if (d.locked && d.icp) {
    lockedIcp = d.icp;
    showIcpCard(d.icp);
  } else {
    inp.disabled = false;
    inp.focus();
  }
}

function addBubble(who, text) {
  const wrap = document.createElement('div');
  wrap.className = 'slide-in flex gap-2.5' + (who === 'user' ? ' justify-end' : '');
  if (who === 'agent') {
    wrap.innerHTML = `
      <div class="w-7 h-7 bg-indigo-600 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-semibold mt-0.5">AI</div>
      <div class="bg-gray-800 rounded-2xl rounded-tl-none px-4 py-3 max-w-sm text-sm leading-relaxed text-gray-100">${esc(text)}</div>`;
  } else {
    wrap.innerHTML = `
      <div class="bg-indigo-600 rounded-2xl rounded-tr-none px-4 py-3 max-w-sm text-sm leading-relaxed text-white">${esc(text)}</div>`;
  }
  const msgs = document.getElementById('chat-messages');
  msgs.appendChild(wrap);
  wrap.scrollIntoView({behavior: 'smooth', block: 'end'});
}

function showIcpCard(icp) {
  const d = document.getElementById('icp-details');
  const rows = [
    ['Industry', icp.industry],
    ['Stage', icp.stage],
    ['Size', icp.company_size],
    ['Roles', (icp.target_roles || []).join(', ')],
    ['Pain', (icp.pain_points || []).join(' · ')],
    ['Keywords', (icp.hn_keywords || []).join(', ')],
  ];
  d.innerHTML = rows.map(([k, v]) => v
    ? `<div><span class="text-gray-500">${k}:</span> <span class="text-gray-200">${esc(v)}</span></div>`
    : '').join('');
  document.getElementById('icp-card').classList.remove('hidden');
  document.getElementById('input-row').classList.add('hidden');
  step(2);
  document.getElementById('icp-card').scrollIntoView({behavior: 'smooth'});
}

async function jumpToCall() {
  const r = await fetch('/leads/seed-demo', {method: 'POST'});
  const lead = await r.json();
  // Show leads view briefly then trigger the call
  document.getElementById('view-icp').classList.add('hidden');
  document.getElementById('view-leads').classList.remove('hidden');
  step(3);
  addLog('⚡ Demo lead seeded — dialing...');
  addCard(lead);
  // Auto-dial after a beat so the card renders
  setTimeout(() => callLead(lead.id), 600);
}

async function usePresetIcp() {
  const icp = {
    industry: "B2B SaaS",
    stage: "Seed / Series A",
    company_size: "1-50 employees",
    target_roles: ["co-founder", "ceo", "founder"],
    pain_points: ["no outbound pipeline", "all customers from warm intros", "founder doing sales manually"],
    hn_keywords: ["saas", "b2b", "workflow", "enterprise"]
  };
  const r = await fetch('/icp/preset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({icp}),
  });
  const d = await r.json();
  sessionId = d.session_id;
  lockedIcp = icp;
  showIcpCard(icp);
}

// ── Pipeline ──────────────────────────────────────────────────────────────────
async function startPipeline() {
  _stepCount = 0;
  document.getElementById('view-icp').classList.add('hidden');
  document.getElementById('view-leads').classList.remove('hidden');

  await fetch('/leads/source', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId}),
  });

  const es = new EventSource(`/leads/stream/${sessionId}`);
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'status') {
      showStep(ev.message);
    } else if (ev.type === 'lead') {
      addCard(ev.lead);
    } else if (ev.type === 'done') {
      showStep(`✓ Done — ${ev.count} lead${ev.count !== 1 ? 's' : ''} found`);
      es.close();
      step(3);
    }
  };
  es.onerror = () => { showStep('Stream error'); es.close(); };
}

let _stepCount = 0;

function showStep(msg) {
  const spinner    = document.getElementById('step-spinner');
  const textEl     = document.getElementById('step-text');
  const countEl    = document.getElementById('step-count');
  const stepDisplay = document.getElementById('step-display');
  const cardsEl    = document.getElementById('cards');
  if (!textEl) return;

  const isDone  = msg.startsWith('✓');
  const isError = msg.toLowerCase().includes('error');

  // If cards are already showing, render done/error as a small tag above them
  const cardsVisible = cardsEl && cardsEl.style.display !== 'none';
  if ((isDone || isError) && cardsVisible) {
    let badge = document.getElementById('pipeline-done');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'pipeline-done';
      badge.className = 'step-fade-in text-xs flex-shrink-0';
      badge.style.maxWidth = '440px';
      badge.style.width = '100%';
      cardsEl.insertBefore(badge, cardsEl.firstChild);
    }
    badge.className = `step-fade-in text-xs flex-shrink-0 ${isDone ? 'text-green-500' : 'text-red-400'}`;
    badge.textContent = msg;
    return;
  }

  if (isDone || isError) {
    if (spinner) spinner.style.display = 'none';
    textEl.className = isDone
      ? 'text-sm text-green-400 leading-relaxed step-fade-in'
      : 'text-sm text-red-400 leading-relaxed step-fade-in';
    textEl.textContent = msg;
    if (countEl) countEl.textContent = '';
  } else {
    _stepCount++;
    if (countEl && _stepCount > 1) {
      countEl.textContent = `${_stepCount - 1} step${_stepCount > 2 ? 's' : ''} completed`;
    }
    textEl.className = 'text-sm text-gray-200 leading-relaxed';
    _typewriter(textEl, msg);
  }
}

function _typewriter(el, text, speed = 14) {
  el.textContent = '';
  let i = 0;
  (function tick() {
    if (i < text.length) { el.textContent += text[i++]; setTimeout(tick, speed); }
  })();
}

// keep addLog as alias so jumpToCall works unchanged
function addLog(msg) { showStep(msg); }

function scoreBadge(s) {
  if (s >= 80) return 'bg-green-500/15 text-green-400 border border-green-500/30';
  if (s >= 65) return 'bg-yellow-500/15 text-yellow-400 border border-yellow-500/30';
  return 'bg-red-500/15 text-red-400 border border-red-500/30';
}

function addCard(lead) {
  // Fade out step display, reveal cards column
  const stepDisplay = document.getElementById('step-display');
  const cardsEl = document.getElementById('cards');
  if (stepDisplay && stepDisplay.style.display !== 'none') {
    stepDisplay.classList.add('fade-out');
    setTimeout(() => { stepDisplay.style.display = 'none'; }, 200);
  }
  if (cardsEl) cardsEl.style.display = 'flex';

  const first = lead.contact_name ? lead.contact_name.split(' ')[0] : 'Founder';
  const el = document.createElement('div');
  el.id = `card-${lead.id}`;
  el.className = 'slide-in bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-gray-700 transition-colors flex-shrink-0 w-full';
  el.style.maxWidth = '440px';
  el.innerHTML = `
    <div class="flex items-start justify-between mb-2">
      <div>
        <div class="font-semibold text-white text-base leading-tight">${esc(lead.company)}</div>
        <div class="text-xs text-gray-600 mt-0.5">YC ${esc(lead.batch || '—')}</div>
      </div>
      <span class="text-xs font-semibold px-2 py-0.5 rounded-md flex-shrink-0 ml-3 ${scoreBadge(lead.icp_score)}">${lead.icp_score}/100</span>
    </div>
    <div class="text-xs text-gray-500 mb-3">${esc(lead.contact_name)} · ${esc(lead.contact_role)}</div>
    <p class="text-xs text-gray-400 leading-relaxed mb-4">${esc(lead.research_summary)}</p>
    <button id="btn-${lead.id}" onclick="callLead('${lead.id}')"
      class="w-full bg-gray-800 hover:bg-indigo-600 border border-gray-700 hover:border-indigo-500 text-gray-400 hover:text-white rounded-lg py-2.5 text-xs font-medium transition-all">
      📞 Call ${esc(first)}
    </button>`;
  document.getElementById('cards').appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

// ── Call ───────────────────────────────────────────────────────────────────────
async function callLead(leadId) {
  const btn = document.getElementById(`btn-${leadId}`);
  btn.textContent = 'Dialing...';
  btn.disabled = true;
  btn.className = btn.className + ' opacity-60 cursor-not-allowed';

  const r = await fetch(`/leads/${leadId}/call`, {method: 'POST'});
  const d = await r.json();

  if (!d.call_id) { btn.textContent = 'Failed'; return; }

  const leads = await (await fetch('/leads')).json();
  activeLead = leads.find(l => l.id === leadId);

  document.getElementById('view-leads').classList.add('hidden');
  document.getElementById('view-call').classList.remove('hidden');
  initWaveform();

  if (activeLead) {
    const first = activeLead.contact_name.split(' ')[0];
    document.getElementById('call-name-pill').textContent = `${first} · ${activeLead.company}`;
  }

  callStartTime = null;
  if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }

  const es = new EventSource(`/call/${d.call_id}/stream`);
  activeCallEs = es;

  es.onmessage = (e) => {
    const turn = JSON.parse(e.data);
    if (turn.content) {
      if (!callStartTime) startCallTimer();
      addTurn(turn.role, turn.content);
      setWaveState(true);
    }
    if (turn.hangup) {
      endCall();
      es.close();
    } else if (turn.role === 'user') {
      document.getElementById('call-status').textContent = 'Prospect speaking...';
    } else if (turn.role === 'assistant') {
      document.getElementById('call-status').textContent = 'Agent speaking...';
    }
  };
  document.getElementById('call-status').textContent = 'Call in progress';
}

function addTurn(role, content) {
  document.getElementById('tx-empty')?.remove();
  const t = document.getElementById('transcript');
  const isAgent = role === 'assistant';
  const speaker = isAgent ? 'Alex' : (activeLead?.contact_name?.split(' ')[0] || 'Prospect');
  const el = document.createElement('div');
  el.className = 'slide-in flex gap-3 items-start';
  el.innerHTML = `
    <span class="text-xs font-semibold pt-0.5 flex-shrink-0 ${isAgent ? 'text-indigo-400' : 'text-white/50'}" style="min-width:46px">${esc(speaker)}</span>
    <span class="text-sm text-white/80 leading-relaxed">${esc(content)}</span>`;
  t.appendChild(el);
  document.getElementById('transcript-wrap').scrollTop = 99999;
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function step(n) {
  const labels = ['ICP Discovery', 'Lead Sourcing', 'Live Call'];
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(`s${i}`);
    el.className = i < n
      ? 'text-gray-600 line-through'
      : i === n
      ? 'text-indigo-400 font-medium'
      : 'text-gray-600';
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
